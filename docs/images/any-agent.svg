<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224">
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect width="880" height="224" rx="10" fill="#0d1117"/>

  <!-- left: agents -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="7s" repeatCount="indefinite"/>
    <text x="24" y="36" font-size="12" fill="#8b949e">any coding agent</text>
    <rect x="24" y="48" width="170" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="109" y="69" text-anchor="middle" font-size="12.5" fill="#e6edf3">Claude Code</text>
    <rect x="24" y="86" width="170" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="109" y="107" text-anchor="middle" font-size="12.5" fill="#e6edf3">Cursor</text>
    <rect x="24" y="124" width="170" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="109" y="145" text-anchor="middle" font-size="12.5" fill="#e6edf3">Codex CLI</text>
    <rect x="24" y="162" width="170" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="109" y="183" text-anchor="middle" font-size="12.5" fill="#e6edf3">OMP · OpenCode · …</text>
  </g>

  <!-- arrows in -->
  <path d="M198 104 H306" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- center: the kit -->
  <rect x="312" y="44" width="256" height="150" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5">
    <animate attributeName="stroke" values="#30363d;#bc8cff;#30363d" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="86" text-anchor="middle" font-size="18" fill="#e6edf3">agent-kit</text>
  <text x="440" y="112" text-anchor="middle" font-size="12" fill="#8b949e">reads the repo · proposes a config</text>
  <text x="440" y="132" text-anchor="middle" font-size="12" fill="#8b949e">23 skills · templates · openspec</text>
  <text x="440" y="152" text-anchor="middle" font-size="12" fill="#8b949e">hooks · CI · init log</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#bc8cff">setup only — ends at the report</text>

  <!-- arrows out -->
  <path d="M574 104 H682" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- right: your repo -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.35;1" dur="7s" repeatCount="indefinite"/>
    <text x="688" y="36" font-size="12" fill="#8b949e">your repo</text>
    <rect x="688" y="48" width="172" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="704" y="76" font-size="12" fill="#79c0ff">.agents/skills/</text>
    <text x="716" y="96" font-size="11.5" fill="#e6edf3">&lt;prefix&gt;-review/</text>
    <text x="716" y="114" font-size="11.5" fill="#e6edf3">&lt;prefix&gt;-flow/</text>
    <text x="716" y="132" font-size="11.5" fill="#e6edf3">&lt;prefix&gt;-tdd/ …</text>
    <text x="704" y="156" font-size="12" fill="#e6edf3">AGENTS.md</text>
    <text x="704" y="172" font-size="11.5" fill="#8b949e">agent-kit-init-log.md</text>
  </g>
</svg>
